# Default configuration for AMR training

# Environment parameters
environment:
  max_episode_steps: 100
  element_budget: 25
  gamma_c: 25.0  # Scaling factor for computational cost penalty

# Training parameters
training:
  total_timesteps: 500
  algorithm: "A2C"  # Options: A2C, PPO, DQN
  learning_rate: 0.0003
  n_steps: 5
  ent_coef: 0.01

# Solver parameters
solver:
  nop: 4  # Polynomial order
  max_level: 4
  courant_max: 0.1
  icase: 1
  initial_elements: [-1, -0.4, 0, 0.4, 1]  # Initial element boundary coordinates
  verbose: false