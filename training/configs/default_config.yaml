# Training configuration for DG AMR

# Algorithm settings
algorithm: "A2C"
total_timesteps: 200000
learning_rate: 0.0003
batch_size: 64
gamma: 0.99

# Environment settings
element_budget: 25
gamma_c: 25.0

# Training settings
verbose: 1
tensorboard_log: "./logs/tensorboard/"
device: "auto"

# Model architecture
policy_kwargs:
  net_arch:
    pi: [64, 64]  # Policy network
    vf: [64, 64]  # Value function network
  activation_fn: "tanh"

# Logging settings
log_interval: 100
checkpoint_freq: 10000