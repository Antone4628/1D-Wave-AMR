environment:
  max_episode_steps: 200
  element_budget: 25
  gamma_c: 100.0
  rl_iterations_per_timestep: "random"  # or a fixed number like 3
  max_rl_iterations: 100
  max_consecutive_no_action: 30
  step_domain_fraction: 0.15  # This will be modified by SLURM script

  # Set initial refinement configuration. Options are none, fixed (provide level), random (provide probability)
  initial_refinement:
    mode: "random"
    fixed_level: 2
    max_initial_level: 4
    probability: 0.7

training:
  total_timesteps: 100000  # Increased from 3000 to 100000
  algorithm: "A2C"
  learning_rate: 0.0003
  n_steps: 5
  ent_coef: 0.01
  callback: "enhanced"  # Options: "simple" or "enhanced"

solver:
  nop: 4
  max_level: 8
  courant_max: 0.1
  icase: 1
  initial_elements: [-1, -0.4, 0, 0.4, 1]
  verbose: false
