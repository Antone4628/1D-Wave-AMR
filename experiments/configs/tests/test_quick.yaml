environment:
  max_episode_steps: 50
  element_budget: 15
  gamma_c: 25.0
  rl_iterations_per_timestep: "random"
  max_rl_iterations: 20
  max_consecutive_no_action: 15
  step_domain_fraction: 0.10

  initial_refinement:
    mode: "random"
    fixed_level: 1
    max_initial_level: 2
    probability: 0.5

training:
  total_timesteps: 1000
  algorithm: "A2C"
  learning_rate: 0.0003
  n_steps: 5
  ent_coef: 0.01
  callback: "enhanced"

solver:
  nop: 4
  max_level: 6
  courant_max: 0.1
  icase: 1
  initial_elements: [-1, -0.4, 0, 0.4, 1]
  verbose: false
