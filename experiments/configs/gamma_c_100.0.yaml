# gamma_c_100.0.yaml
environment:
  max_episode_steps: 300
  element_budget: 25
  gamma_c: 100.0  # This varies per configuration file
  rl_iterations_per_timestep: "random"  # or a fixed number like 3
  max_rl_iterations: 30
  max_consecutive_no_action: 10

training:
  total_timesteps: 50000
  algorithm: "A2C"
  learning_rate: 0.0003
  n_steps: 5
  ent_coef: 0.01

solver:
  nop: 4
  max_level: 8
  courant_max: 0.1
  icase: 1
  initial_elements: [-1, -0.4, 0, 0.4, 1]
  verbose: false
