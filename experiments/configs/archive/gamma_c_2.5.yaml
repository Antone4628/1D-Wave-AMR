# gamma_c_2.5.yaml
environment:
  max_episode_steps: 100
  element_budget: 25
  gamma_c: 2.5  # This varies per configuration file

training:
  total_timesteps: 100000
  algorithm: "A2C"
  learning_rate: 0.0005
  n_steps: 10
  ent_coef: 0.05

solver:
  nop: 4
  max_level: 4
  courant_max: 0.1
  icase: 1
  initial_elements: [-1, 0, 1]
  verbose: false
