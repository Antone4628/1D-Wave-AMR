environment:
  element_budget: 25
  gamma_c: 50.0
  initial_refinement:
    fixed_level: 2
    max_level: 3
    mode: fixed
    probability: 0.7
  max_consecutive_no_action: 100
  max_episode_steps: 300
  max_rl_iterations: 30
  rl_iterations_per_timestep: random
solver:
  courant_max: 0.1
  icase: 1
  initial_elements: !!python/object/apply:numpy.core.multiarray._reconstruct
    args:
    - !!python/name:numpy.ndarray ''
    - !!python/tuple
      - 0
    - !!binary |
      Yg==
    state: !!python/tuple
    - 1
    - !!python/tuple
      - 5
    - !!python/object/apply:numpy.dtype
      args:
      - f8
      - false
      - true
      state: !!python/tuple
      - 3
      - <
      - null
      - null
      - null
      - -1
      - -1
      - 0
    - false
    - !!binary |
      AAAAAAAA8L+amZmZmZnZvwAAAAAAAAAAmpmZmZmZ2T8AAAAAAADwPw==
  max_level: 8
  nop: 4
  verbose: false
training:
  algorithm: A2C
  ent_coef: 0.01
  learning_rate: 0.0003
  n_steps: 5
  total_timesteps: 10000
