environment:
  max_episode_steps: 200
  element_budget: 40
  gamma_c: 25.0
  rl_iterations_per_timestep: "random"  # or a fixed number like 3
  max_rl_iterations: 200

training:
  total_timesteps: 20000
  algorithm: "A2C"
  learning_rate: 0.0003
  n_steps: 5
  ent_coef: 0.01

solver:
  nop: 4
  max_level: 4
  courant_max: 0.1
  icase: 1
  initial_elements: [-1, -0.4, 0, 0.4, 1]
  verbose: false
